# Tag a version, get the release.
#
# Windows and Linux build on their own OS, x64 and arm64. macOS is the Swift
# app, not an Electron target. Cross-building the Electron app from one OS
# stops partway: electron-builder ships an x86_64 mksquashfs for macOS hosts,
# so an AppImage cannot be produced on Apple Silicon at all, and NSIS needs wine.
#
# Nothing here auto-updates anything. It produces files, attaches them to a
# release, and stops.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # only to create the release. Nothing else.

jobs:
  # Cheapest gate first: if the two builds' shared assets have drifted, the
  # platforms will not sound alike and there is no point building either.
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check-shared-assets.sh

  # Windows and Linux are separate jobs rather than a matrix, because what each
  # one can be trusted to produce is different and the difference matters.
  windows:
    needs: assets
    runs-on: windows-latest
    defaults:
      run: { working-directory: cross-platform }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: cross-platform/package-lock.json }
      - run: npm ci
      - run: npm run check
      - run: npm run parity
      - run: npm run smoke
      # electron-builder 25.1.8 returns a named CLI target list before it reads
      # the arch lists in build.win.target, so `--win nsis zip` on
      # windows-latest is x64 only and install.ps1 never sees an *arm64*.exe.
      # `--x64` and `--arm64` are applied to the targets named beside them.
      # Two invocations: one build of both NSIS arches also writes a universal
      # installer whose name drops ${arch} (Voice-Forge.exe). build.win.target
      # is x64 NSIS, x64 zip, and arm64 NSIS, and that is the whole set.
      - name: Windows x64 (NSIS and zip)
        run: npx electron-builder --win nsis zip --x64 --publish never
      - name: Windows arm64 NSIS
        run: npx electron-builder --win nsis --arm64 --publish never
      # install.ps1 selects *arm64*.exe on ARM Windows and *x64*.exe otherwise.
      # The upload glob is *.exe, which is not the same check: a differently
      # named installer would still upload and the script would miss it.
      # Both builds write into dist. If the arm64 build removed the x64 files,
      # this fails the job instead of publishing a Windows release with no zip.
      - name: Installer names
        shell: pwsh
        run: |
          foreach ($f in @('dist/Voice-Forge-x64.exe', 'dist/Voice-Forge-arm64.exe', 'dist/Voice-Forge-x64.zip')) {
            if (-not (Test-Path $f)) { throw "missing $f" }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          # The publish job downloads this minutes later and attaches it to the
          # release, which is the copy that lasts. Keeping a second one for the
          # default ninety days filled the account's whole Actions storage
          # allowance with duplicates of files already published.
          retention-days: 1
          # Extension globs, so Voice-Forge-arm64.exe is uploaded with the x64
          # installer and the x64 zip. There is no arm64 zip.
          path: |
            cross-platform/dist/*.exe
            cross-platform/dist/*.zip
          if-no-files-found: error

  linux:
    needs: assets
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: cross-platform }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: cross-platform/package-lock.json }
      - run: npm ci
      - run: npm run check
      - run: npm run parity
      - run: npm run smoke

      # tar.gz is the artifact that has actually been run: a Steam Deck, x86-64,
      # SteamOS. It builds, it launches, and it sounds right. x64 stays
      # required. arm64 is required as well: install.sh looks for arm64.tar.gz
      # and exits if the release has none. A named target skips the arch list
      # in build.linux.target, so the arch flags are explicit, and each arch is
      # its own step so the log names which one failed.
      - name: Linux archive x64 (verified on SteamOS)
        run: npx electron-builder --linux tar.gz --x64 --publish never
      - name: Linux archive arm64
        run: npx electron-builder --linux tar.gz --arm64 --publish never

      # AppImage and deb have never been built successfully anywhere in this
      # project -- AppImage cannot even be attempted from macOS, where
      # electron-builder ships an x86_64 mksquashfs. They are attempted here
      # and allowed to fail, because an unproven convenience format should not
      # take down a release of the format people have actually used. arm64
      # AppImage is the same kind of attempt. deb stays x64, which is all
      # build.linux.target asks for. Each target and arch is its own step so
      # the log names which one broke.
      - name: Install the packaging tools deb and AppImage want
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg libarchive-tools
        working-directory: .
      - name: AppImage x64 (unproven)
        continue-on-error: true
        run: npx electron-builder --linux AppImage --x64 --publish never
      - name: AppImage arm64 (unproven)
        continue-on-error: true
        run: npx electron-builder --linux AppImage --arm64 --publish never
      - name: deb x64 (unproven)
        continue-on-error: true
        run: npx electron-builder --linux deb --x64 --publish never

      - name: What actually built
        run: ls -la dist/ || true

      # install.sh selects arm64.tar.gz or x64.tar.gz. *.tar.gz would upload a
      # file the script does not recognise, so the names are checked here.
      - name: Archive names
        run: |
          test -f dist/Voice-Forge-x64.tar.gz
          test -f dist/Voice-Forge-arm64.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          retention-days: 1
          path: |
            cross-platform/dist/*.tar.gz
            cross-platform/dist/*.AppImage
            cross-platform/dist/*.deb
          # warn, not error: the tar.gz steps above already failed the job if
          # either archive is missing. AppImage and deb are allowed to be
          # absent. The globs match Voice-Forge-arm64.tar.gz and
          # Voice-Forge-arm64.AppImage along with the x64 files.
          if-no-files-found: warn

  macos:
    needs: assets
    runs-on: macos-latest
    defaults:
      run: { working-directory: macos }
    steps:
      - uses: actions/checkout@v7
      - run: ./build.sh            # runs vfcheck first and fails the build on a red suite
      - name: Package the app
        run: ditto -c -k --keepParent "Voice Forge.app" "Voice-Forge-macOS.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          retention-days: 1
          path: macos/Voice-Forge-macOS.zip
          if-no-files-found: error

  publish:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with: { path: artifacts }
      - run: find artifacts -type f | sort

      # Checksums, so the installer can verify what it downloaded rather than
      # trusting the transport. Without this the SHA256 step in install.sh
      # would be theatre.
      - name: Checksums
        run: |
          cd artifacts
          find . -type f ! -name SHA256SUMS -printf "%P\n" | sort | while read -r f; do
            sha256sum "$f"
          done > ../SHA256SUMS
          cd .. && cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*
            SHA256SUMS
          draft: true          # look at it before anybody else does
          body: |
            Built from this tag. Every platform builds on itself and every
            check suite runs first.

            **Windows is untested.** It is configured and it builds; nobody has
            run it. If you do, tell me what happened — @snepssen on Telegram.
